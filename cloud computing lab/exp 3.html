```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Car Booking Reservation System</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f2f5f9;
        }

        .header {
            background: #1565c0;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .header h1 {
            margin: 0;
        }

        .header p {
            margin-top: 8px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h2 {
            color: #1565c0;
        }

        .booking-type {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .booking-type button {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #e3eaf2;
            font-size: 15px;
        }

        .booking-type button.active {
            background: #1565c0;
            color: white;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 7px;
            color: #333;
        }

        input,
        select {
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 15px;
        }

        .search-btn {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #1565c0;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .search-btn:hover {
            background: #0d47a1;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #e8f5e9;
            border-left: 5px solid #2e7d32;
            border-radius: 6px;
        }

        .cab-card {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .cloud {
            text-align: center;
            margin-top: 25px;
            color: #555;
        }

        @media(max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🚕 Cloud Car Booking Reservation System</h1>
        <p>SaaS-Based Cab Booking Application</p>
    </div>

    <div class="container">

        <h2>Search for Cabs</h2>

        <!-- Booking Type -->
        <div class="booking-type">

            <button id="localBtn"
                    class="active"
                    onclick="selectBookingType('Local')">
                🚕 Local
            </button>

            <button id="rentalBtn"
                    onclick="selectBookingType('Rental')">
                🚗 Rental
            </button>

            <button id="outstationBtn"
                    onclick="selectBookingType('Outstation')">
                🛣 Outstation
            </button>

        </div>


        <div class="form-grid">

            <!-- From -->
            <div class="form-group">
                <label>From</label>

                <input type="text"
                       id="from"
                       placeholder="Enter pickup location">
            </div>


            <!-- To -->
            <div class="form-group">
                <label>To</label>

                <input type="text"
                       id="to"
                       placeholder="Enter destination">
            </div>


            <!-- Date -->
            <div class="form-group">
                <label>Journey Date</label>

                <input type="date"
                       id="date">
            </div>


            <!-- Time -->
            <div class="form-group">
                <label>Pickup Time</label>

                <input type="time"
                       id="time">
            </div>


            <!-- Package Type -->
            <div class="form-group">
                <label>Package Type</label>

                <select id="packageType"
                        onchange="updateDuration()">

                    <option value="">Select Package</option>
                    <option>4 Hours / 40 KM</option>
                    <option>6 Hours / 60 KM</option>
                    <option>8 Hours / 80 KM</option>
                    <option>10 Hours / 100 KM</option>
                    <option>12 Hours / 120 KM</option>
                </select>
            </div>


            <!-- Hours / Days -->
            <div class="form-group">
                <label>Hours / Days</label>

                <select id="duration">

                    <option>4 Hours</option>
                    <option>6 Hours</option>
                    <option>8 Hours</option>
                    <option>10 Hours</option>
                    <option>12 Hours</option>
                    <option>1 Day</option>
                    <option>2 Days</option>
                    <option>3 Days</option>

                </select>
            </div>


            <!-- Car Type -->
            <div class="form-group">
                <label>Car Type</label>

                <select id="carType">

                    <option>Mini</option>
                    <option>Sedan</option>
                    <option>SUV</option>
                    <option>Luxury</option>
                    <option>Tempo Traveller</option>

                </select>
            </div>


            <!-- Passengers -->
            <div class="form-group">
                <label>Passengers</label>

                <select id="passengers">

                    <option>1 Passenger</option>
                    <option>2 Passengers</option>
                    <option>3 Passengers</option>
                    <option>4 Passengers</option>
                    <option>5 Passengers</option>
                    <option>6+ Passengers</option>

                </select>
            </div>


            <!-- Payment -->
            <div class="form-group">
                <label>Payment Method</label>

                <select id="payment">

                    <option>Cash</option>
                    <option>UPI</option>
                    <option>Credit Card</option>
                    <option>Debit Card</option>
                    <option>Net Banking</option>

                </select>
            </div>


            <!-- AC -->
            <div class="form-group">
                <label>Car Preference</label>

                <select id="preference">

                    <option>AC</option>
                    <option>Non-AC</option>

                </select>
            </div>

        </div>


        <!-- Search Button -->
        <button class="search-btn"
                onclick="searchCab()">

            🔍 Search Cabs

        </button>


        <!-- Search Result -->
        <div id="result">

            <h3>Available Cab Booking Details ✅</h3>

            <div class="cab-card">

                <p id="resultText"></p>

            </div>

        </div>


        <div class="cloud">
            ☁ Cloud SaaS Application | Cab Booking Management System
        </div>

    </div>


    <script>

        let bookingType = "Local";


        function selectBookingType(type) {

            bookingType = type;

            document.getElementById("localBtn")
                .classList.remove("active");

            document.getElementById("rentalBtn")
                .classList.remove("active");

            document.getElementById("outstationBtn")
                .classList.remove("active");


            if (type === "Local") {

                document.getElementById("localBtn")
                    .classList.add("active");

            }

            else if (type === "Rental") {

                document.getElementById("rentalBtn")
                    .classList.add("active");

            }

            else {

                document.getElementById("outstationBtn")
                    .classList.add("active");

            }
        }


        function updateDuration() {

            let packageType =
                document.getElementById("packageType").value;

            let duration =
                document.getElementById("duration");


            if (packageType.includes("4 Hours")) {

                duration.value = "4 Hours";

            }

            else if (packageType.includes("6 Hours")) {

                duration.value = "6 Hours";

            }

            else if (packageType.includes("8 Hours")) {

                duration.value = "8 Hours";

            }

            else if (packageType.includes("10 Hours")) {

                duration.value = "10 Hours";

            }

            else if (packageType.includes("12 Hours")) {

                duration.value = "12 Hours";

            }
        }


        function searchCab() {

            let from =
                document.getElementById("from").value;

            let to =
                document.getElementById("to").value;

            let date =
                document.getElementById("date").value;

            let time =
                document.getElementById("time").value;

            let packageType =
                document.getElementById("packageType").value;

            let duration =
                document.getElementById("duration").value;

            let carType =
                document.getElementById("carType").value;

            let passengers =
                document.getElementById("passengers").value;

            let payment =
                document.getElementById("payment").value;

            let preference =
                document.getElementById("preference").value;


            if (from === "" ||
                to === "" ||
                date === "" ||
                time === "") {

                alert(
                    "Please enter From, To, Date and Pickup Time."
                );

                return;
            }


            if (from.toLowerCase() ===
                to.toLowerCase()) {

                alert(
                    "Pickup and destination cannot be the same."
                );

                return;
            }


            let message =

                "<b>Booking Type:</b> " +
                bookingType + "<br><br>" +

                "<b>From:</b> " +
                from + "<br>" +

                "<b>To:</b> " +
                to + "<br>" +

                "<b>Journey Date:</b> " +
                date + "<br>" +

                "<b>Pickup Time:</b> " +
                time + "<br>" +

                "<b>Package Type:</b> " +
                (packageType || "Not Selected") +
                "<br>" +

                "<b>Duration:</b> " +
                duration + "<br>" +

                "<b>Car Type:</b> " +
                carType + "<br>" +

                "<b>Passengers:</b> " +
                passengers + "<br>" +

                "<b>Car Preference:</b> " +
                preference + "<br>" +

                "<b>Payment:</b> " +
                payment;


            document.getElementById("resultText")
                .innerHTML = message;

            document.getElementById("result")
                .style.display = "block";
        }

    </script>

</body>
</html>
```
