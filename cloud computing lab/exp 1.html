```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Flight Reservation System</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #eef3f8;
        }

        .header {
            background: #1565c0;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        .header p {
            margin: 8px 0 0;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .trip-type {
            display: flex;
            gap: 25px;
            margin-bottom: 20px;
        }

        .trip-type label {
            font-weight: bold;
        }

        .flight-type {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .flight-type button {
            padding: 10px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #e3eaf2;
        }

        .flight-type button.active {
            background: #1565c0;
            color: white;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input, select {
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 15px;
        }

        .search-btn {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 18px;
            cursor: pointer;
        }

        .search-btn:hover {
            background: #0d47a1;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #e8f5e9;
            border-left: 5px solid #2e7d32;
            border-radius: 6px;
        }

        .cloud {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        @media(max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>✈ Cloud Flight Reservation System</h1>
        <p>SaaS-Based Flight Booking Application</p>
    </div>

    <div class="container">

        <h2>Search Flights</h2>

        <div class="trip-type">
            <label>
                <input type="radio" name="trip" value="One Way" checked>
                One Way
            </label>

            <label>
                <input type="radio" name="trip" value="Round Trip">
                Round Trip
            </label>
        </div>

        <div class="flight-type">
            <button id="domesticBtn" class="active"
                    onclick="selectFlightType('Domestic')">
                Domestic
            </button>

            <button id="internationalBtn"
                    onclick="selectFlightType('International')">
                International
            </button>
        </div>

        <div class="form-grid">

            <div class="form-group">
                <label>From</label>
                <select id="from">
                    <option value="">Select City</option>
                    <option>Chennai (MAA)</option>
                    <option>Delhi (DEL)</option>
                    <option>Mumbai (BOM)</option>
                    <option>Bangalore (BLR)</option>
                    <option>Hyderabad (HYD)</option>
                    <option>Kolkata (CCU)</option>
                </select>
            </div>

            <div class="form-group">
                <label>To</label>
                <select id="to">
                    <option value="">Select City</option>
                    <option>Chennai (MAA)</option>
                    <option>Delhi (DEL)</option>
                    <option>Mumbai (BOM)</option>
                    <option>Bangalore (BLR)</option>
                    <option>Hyderabad (HYD)</option>
                    <option>Kolkata (CCU)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Departure</label>
                <input type="date" id="departure">
            </div>

            <div class="form-group" id="returnGroup">
                <label>Return</label>
                <input type="date" id="returnDate">
            </div>

            <div class="form-group">
                <label>Travelers</label>
                <select id="travelers">
                    <option>1 Traveler</option>
                    <option>2 Travelers</option>
                    <option>3 Travelers</option>
                    <option>4 Travelers</option>
                    <option>5 Travelers</option>
                    <option>6 Travelers</option>
                </select>
            </div>

            <div class="form-group">
                <label>Class</label>
                <select id="classType">
                    <option>Economy</option>
                    <option>Premium Economy</option>
                    <option>Business</option>
                    <option>First Class</option>
                </select>
            </div>

            <div class="form-group">
                <label>Fare Type</label>
                <select id="fareType">
                    <option>Regular Fare</option>
                    <option>Student Fare</option>
                    <option>Senior Citizen Fare</option>
                    <option>Armed Forces Fare</option>
                </select>
            </div>

            <div class="form-group">
                <label>Currency</label>
                <select>
                    <option>INR - Indian Rupee</option>
                    <option>USD - US Dollar</option>
                    <option>EUR - Euro</option>
                </select>
            </div>

        </div>

        <button class="search-btn" onclick="searchFlight()">
            🔍 Search Flights
        </button>

        <div id="result">
            <h3>Flight Search Successful ✈</h3>
            <p id="resultText"></p>
        </div>

        <div class="cloud">
            ☁ Application hosted as a Cloud SaaS demonstration
        </div>

    </div>


    <script>

        let flightType = "Domestic";

        function selectFlightType(type) {

            flightType = type;

            document.getElementById("domesticBtn")
                .classList.remove("active");

            document.getElementById("internationalBtn")
                .classList.remove("active");

            if (type === "Domestic") {
                document.getElementById("domesticBtn")
                    .classList.add("active");
            } else {
                document.getElementById("internationalBtn")
                    .classList.add("active");
            }
        }


        // Show/hide return date
        const tripRadios = document.querySelectorAll(
            'input[name="trip"]'
        );

        tripRadios.forEach(function(radio) {

            radio.addEventListener("change", function() {

                if (this.value === "One Way") {

                    document.getElementById("returnGroup")
                        .style.display = "none";

                } else {

                    document.getElementById("returnGroup")
                        .style.display = "flex";

                }

            });

        });


        function searchFlight() {

            let from = document.getElementById("from").value;
            let to = document.getElementById("to").value;
            let departure = document.getElementById("departure").value;
            let returnDate = document.getElementById("returnDate").value;
            let travelers = document.getElementById("travelers").value;
            let classType = document.getElementById("classType").value;
            let fareType = document.getElementById("fareType").value;

            let trip = document.querySelector(
                'input[name="trip"]:checked'
            ).value;


            if (from === "" || to === "" || departure === "") {

                alert("Please fill From, To and Departure fields.");
                return;

            }


            if (from === to) {

                alert("From and To cities cannot be the same.");
                return;

            }


            if (trip === "Round Trip" && returnDate === "") {

                alert("Please select the return date.");
                return;

            }


            let message =
                "<b>Flight Type:</b> " + flightType + "<br>" +
                "<b>Trip:</b> " + trip + "<br>" +
                "<b>From:</b> " + from + "<br>" +
                "<b>To:</b> " + to + "<br>" +
                "<b>Departure:</b> " + departure + "<br>";

            if (trip === "Round Trip") {

                message +=
                    "<b>Return:</b> " + returnDate + "<br>";

            }

            message +=
                "<b>Travelers:</b> " + travelers + "<br>" +
                "<b>Class:</b> " + classType + "<br>" +
                "<b>Fare Type:</b> " + fareType;


            document.getElementById("resultText").innerHTML =
                message;

            document.getElementById("result").style.display =
                "block";
        }

    </script>

</body>
</html>
